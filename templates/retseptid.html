{% extends 'baas.html' %}
{% block header %}
    <h1 class="bordered">Retseptid</h1>
    <form action="{{ url_for('retseptid_tulemused') }}" method="GET">
        Otsi: <input type="text" name="otsi" value="{{ otsi }}">
        <input type="submit" value="Otsi" class="button">

    </form>
    <br>
    <button type="button" class="collapsible">Filter</button>

    <div class="retseptide-grid">
        {% for retsept in retseptid %}
            <article class="retsepti-kaart">

                <img class="retsepti-pilt" src="{{ url_for('static', filename='retseptid/' ~ retsept.pilt) }}" alt="{{ retsept.nimi }}">

                <h2 class="retsepti-nimi">
                    {{ retsept.nimi }}
                </h2>

                <div>
                    <div class="dieedi-grid">
                    {% if retsept.dieedid %}
                        {% for dieet in retsept.dieedid %}
                            <span class="dieedi-silt">{{ dieet.nimi }}</span>
                        {% endfor %}
                    {% endif %}
                    </div>
                </div>

            </article>
        {% else %}
            <p>Andmebaasis pole veel retsepte.</p>
        {% endfor %}
    </div>

{% endblock %}
